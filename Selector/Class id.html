<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <!-- Types of Element Selector -->
    <style>
        /* div{
            background-color: red;
        } */
        /* Class Selector */
        .red{
            background-color: red;
            /* .red mean class in red */
        }

        /* id selector */
        #green{
            background-color: green;
        }
    </style>
</head>
<body>
    <div class="red">I am a Div</div>

    <div id="green">I am another div</div>
</body>
</html>
