<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descendant Selector</title>
    <style>
        /* In Descendant tag it dont see child of any element if the element is inside an element then it will be used */
        div p {
            color: purple;
            background-color: aquamarine;
        }
    </style>
</head>
<body>
    <div>
        Hi i am a Div
        <article>
          <p>I am a child of div</p>
        </article>

    </div>
</body>
</html>
