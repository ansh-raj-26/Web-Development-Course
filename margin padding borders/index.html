<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Boxmodel</title>
    <style>
      *{
        margin: 0px;
        padding: 0px;
      }
      .box{
        background-color: aqua;
      }
      .box1{
        color: red;
        padding: 10px;
        margin: 25px;
        border: 2px solid black;
        height: 200px;
        box-sizing: border-box;
        /* box sizing element se total height 200 hogi na ki box ki size means paddig+border but agar humlog box sizing element hata de toh sirf element ki hight200 hogi */

        /* Margin Collapse element---Imp h */
      }
      .box2{
        color: rgb(255, 10, 255);
      }
    </style>
  </head>
  <body>
    <div class="box box1">I am a Box</div>
    <div class="box box2">I am another Box</div>

  </body>
</html>
