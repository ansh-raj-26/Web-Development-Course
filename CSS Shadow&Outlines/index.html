<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        border: 3px solid rgb(43, 255, 0);
        padding: 23px;
        box-shadow: 5px 5px 15px 1px rgb(12, 166, 209);
      }

      .text-element {
        text-shadow: 2px 2px 4px #e40000f5;
        outline: 2px solid blue;
        border: 3px solid black;
        border-radius: 10px;
        /* outline-offset: 5px; */
      }
      /* Syntax for shadow box-shadwo: h-offset v-offset blur spred color inset;
        
h-offset and v-offset: Determines the shadow's horizontal and vertical position.
blur: The larger the value, the blurrier the shadow.
spread: Expands or shrinks the shadow size.
color: Defines the shadow color.
inset: Makes the shadow inner.
*/
    </style>
  </head>
  <body>
    <div class="box">I am a Box</div>

    <p class="text-element">
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Praesentium quos
      placeat consequatur.
    </p>
  </body>
</html>
