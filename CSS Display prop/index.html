<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block and inline properrties</title>
</head>
<style>
*{
    margin: 0px;
    padding: 0px;
}
.box{
    border: solid blue;
    display: inline-block;
    /* display:inline; display inline property prevents width padding and margin having an effect so we use inline-block propertie */
    width: 344px;
    padding: 45px;
    margin: 34px;
}
.box1{
    /* display: none; */
    /* visibility: hidden; */
    display: flex;
}
</style>
<body>
    <div class="box box1">I am a Box</div>
    <div class="box">also a Box</div>
    <span>I am a Good</span>
    <span>Boy</span>
</body>
</html>
