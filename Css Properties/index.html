<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position Properties</title>
    <style>
      /* Static Propertice where you cant change the postion of an element in css */
      /* for example top heoght of the box be of 2px which aur down be of 11px */
              *{
                  margin: 0px;
                  padding: 0px;
              }
              .box{
                  height: 130px;
                  width: 80vw;
                  padding: 3px;
                  margin: 3px;
                  border: 2px Solid black;
              }
              .box1{
                  background-color: bisque;
                   /* position: relative; /*By relative poition we can use top properties */
                  top: 64px;
                  left: 120px; */

      /* i you want the  box1 to be on the obove  then use z index */
              }
              .box2{
                  background-color: aqua;
                  /* position: relative;
                  z-index: 1; */
              }
              .box3{
                position: absolute;
                top: 3px;
                left: 0px;
                  background-color: aquamarine;
              }
              .box4{background-color: royalblue;}

              .parent{
                padding: 43px;
                margin: 34px;
                position: absolute;
/* absolute ka matlab agar mai koi box me position absolute laga du and the top ya left properties add karenge toh wo parent box ke hisab se set ho ga naki html ke agar parent box me koi position properties nai hoti then wo html ke according set hota  */
                  border: 2px solid purple;
              }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="box box1"></div>
      <div class="box box2"></div>
      <div class="box box3"></div>
      <div class="box box4"></div>
    </div>
  </body>
</html>
