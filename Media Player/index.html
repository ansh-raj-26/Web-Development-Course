<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6Audio and 6video</title>
</head>
<body>
    <h1>Audio and Video Html</h1>

    <div class="Audio">
        <audio src="1.mp3" controls muted height="300" width="300">1.mp3</audio>
        <audio src="2.mp3" controls muted height="300" width="300">1.mp3</audio>
        <audio src="3.mp3" controls muted height="300" width="300">3.mp3</audio>
        <audio src="4.mp3" controls muted height="300" width="300">4.mp3</audio>
        <audio src="5.mp3" controls muted height="300" width="300">5.mp3</audio>
        <audio src="6.mp3" controls muted height="300" width="300">6.mp3</audio>
     </div>


    <div class="Video">
        <video src="1.mp4" controls muted height="300" width="200">1.mp4</video>
        <video src="2.mp4" controls muted height="300" width="200">2.mp4</video>
        <video src="3.mp4" controls muted height="300" width="200">3.mp4</video>
        <video src="4.mp4" controls muted height="300" width="200">4.mp4</video>
        <video src="5.mp4" controls muted height="300" width="200">5.mp4</video>
        <video src="6.mp4" controls muted height="300" width="200">6.mp4</video>
    </div>
</body>
</html>
