        Create a Website which shows videos of differernt categories and audios of different categories in iframe

    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>random videos and audio</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>"Random Audio and Video Through Iframe"</h1>
        <table>
            <tr>
                <th style="background-color: aquamarine;" style="display: flex;" colspan="5">Sigma Web-development Course 1</th>
                <th style="background-color: aquamarine;" style="display:flex;" colspan="5" >Random Audio</th>   
            </tr>
            <tr>
                <td colspan="5">
                    <iframe width="300" height="300" src="https://www.youtube.com/embed/tVzUXW6siu0?si=e656fR4I-Mf9DS7V" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; mute; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </td>
                <td colspan="5">
                    <audio src="audio2.mp3" controls muted></audio>
                </td>
            </tr>
        </table>
    </body>
    </html>
