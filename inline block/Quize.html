<!--Quize
without using br tag write a vertically aligned form asking for name city and pincode of a user
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form For name,City,pincode</title>
</head>
<body>
    <h1>Form for city name pincode</h1>
    <div>
        <label for="Username">Enter your name here</label>
        <input type="text" required name="Username" id="Username" placeholder="Minimum 5 Charecters">
    </div>
    <div>
        <label for="city">City Name</label>
        <input type="text" required name="city" id="city"> 
    </div>
    <div>
        <label for="pincode">Enter Your Pincode</label>
        <input type="text" name="pincode" id="pincode" placeholder="Write only Numbers">
    </div>
</body>
</html>
