<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Position Properties</title>
  <style>
    /* Static Propertise where you cant change the postion of an element in css */
    /* for example top heoght of the box be of 2px which aur down be of 11px */
    * {
      margin: 0px;
      padding: 0px;
    }

    .parent {
      padding: 43px;
      margin: 34px;
      /* position: absolute; */
      /* absolute ka matlab agar mai koi box me position absolute laga du and the top ya left properties add karenge toh wo parent box ke hisab se set ho ga naki html ke. Agar parent box me koi position properties nai hoti then wo html ke according set hota  */
      /* Basically Nearest positioned ancestor ke lag jayega*/
      border: 2px solid purple;
    }

    .box {
      height: 350px;
      width: 80vw;
      padding: 3px;
      margin: 3px;
      border: 2px Solid black;
    }

    .box1 {
      background-color: bisque;
      position: sticky;
      /* sticky ka matlab ki wo element scroll ke sath move karega but uski position fixed rahegi */
      top: 0px;
      /* position: relative; /*By relative poition we can use top or any properties */
      /* top: 64px;
        left: 120px; */

      /* if you want the  box1 to be on the obove  then use z index and position will be relative*/
    }

    .box2 {
      background-color: aqua;
      /* position: relative;
         z-index: 1; the content comes front or backward if z index is 0 then backward and if 1 then front*/
    }

    .box3 {
      background-color: aquamarine;
      /* position: absolute;
        top: 3px;
        left: 0px; */
    }

    .box4 {
      background-color: royalblue;
      /* position: fixed; */
      /* Position fixed ka matlab ki element ki position fix ho jayegi chahe fir mai scroll karo ya kuch bhi wo element will show every time */
      left: 450px;
      bottom: 8vw;

    }
  </style>
</head>

<body>
  <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
  </div>
</body>

</html>
