<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling List items</title>
    <style>
        nav ul li{
            list-style: devanagari;
            list-style-type: "😍";
            background-color: bisque;
            border: 1px solid black;
            /* lisstyle position marker ko bhi color ke andar le leta h */
            list-style-position: inside;
            /* list-style-image: url("C:\Users\anshr\Desktop\Daco_4119700.png"); */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
