<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav using list</title>
    <style>
        nav ul li{
            list-style: none;
            padding: 25px;
            border: 1px solid black;
            border-radius: 10px;
            font-weight: bold;
        }

        ul{
            display: flex;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
